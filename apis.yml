aid: kateeva
name: Kateeva
description: >-
  Kateeva is a Silicon Valley capital-equipment company that builds inkjet printing systems for
  manufacturing advanced displays. It was co-founded in 2008 by Conor Madigan, PhD, Valerie
  Gassend, PhD, and Gerry Chen, PhD, on the conviction that precision inkjet deposition could make
  OLED displays mass-producible at cost. The company introduced its YIELDjet platform in 2013 —
  the display industry's first inkjet equipment solution for depositing the organic thin film
  encapsulation (TFE) layer of an OLED panel — and shipped the first commercial YIELDjet FLEX
  system a year later, which became the market-leading tool for flexible mobile OLED mass
  production. Its current product line is the YIELDjet Lassen, Jarvis, Tioga and Kuna printers,
  spanning substrate sizes and applications from TFE to OLED RGB pixel deposition and microlens
  planarization. Kateeva moved its global headquarters to Newark, California in 2015 and operates
  in China, Korea, Japan and Taiwan; it raised roughly $200 million through a 2016 Series E backed
  by BOE, TCL Capital, Redview Capital, Samsung Venture Investment, Sigma Partners, Spark Capital,
  Madrone Capital Partners, DBL Partners and Veeco. Kateeva sells machines to display panel
  makers, not software: it publishes no developer program, no developer portal, no SDKs and no
  API documentation of any kind. The only machine-readable interface it exposes is the WordPress
  REST content API behind its corporate website at kateeva.com, which is captured here for
  discovery purposes and is anonymously readable but read-only.
