error_examples:
- name: per_page above the bound
  request: 'GET /wp/v2/posts?per_page=999'
  http_status: 400
  response: '{"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 100 (inclusive)"}}}'
- name: unknown route
  request: 'GET /wp/v2/nope'
  http_status: 404
  response: '{"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
- name: privileged read
  request: 'GET /wp/v2/settings'
  http_status: 401
  response: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
