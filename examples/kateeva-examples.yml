    url: https://kateeva.com
    namespaces: [oembed/1.0, wpml/v1, contact-form-7/v1, cookieyes/v1, redirection/v1, yoast/v1, wpml/tm/v1, wpml/ate/v1, wpml/st/v1, filebird/v1, filebird/public/v1, wp-rocket/v1, otgs/installer/v1, mailpoet/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1]
